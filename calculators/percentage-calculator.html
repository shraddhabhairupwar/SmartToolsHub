<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Percentage Calculator - SmartToolsHub</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f4f7fb;
}

header{
background:#2563eb;
color:white;
padding:18px 8%;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{
font-size:28px;
}

header a{
color:white;
text-decoration:none;
font-weight:bold;
margin-left:20px;
}

.container{
max-width:700px;
margin:50px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.container h2{
text-align:center;
margin-bottom:10px;
color:#2563eb;
}

.container p{
text-align:center;
color:#555;
margin-bottom:25px;
}

label{
display:block;
margin-top:18px;
margin-bottom:8px;
font-weight:bold;
}

input{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:15px;
margin-top:25px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#1d4ed8;
}

.result{
margin-top:25px;
padding:20px;
background:#e8f5e9;
border-radius:8px;
text-align:center;
font-size:22px;
font-weight:bold;
display:none;
}

.error{
background:#ffebee;
color:red;
}

.info{
margin-top:35px;
background:#f8f9fa;
padding:20px;
border-radius:10px;
line-height:1.8;
}

footer{
margin-top:50px;
background:#111827;
color:white;
text-align:center;
padding:25px;
}

.buttons{
display:flex;
gap:15px;
margin-top:25px;
}

.buttons button{
flex:1;
}

.grade{
margin-top:20px;
font-size:28px;
text-align:center;
font-weight:bold;
color:#f7444e;
}

.progress{
width:100%;
height:22px;
background:#ddd;
border-radius:20px;
margin-top:25px;
overflow:hidden;
}

.progress-bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#f7444e,#78bcc4);
transition:1s;
}


@media(max-width:768px){

header{
flex-direction:column;
}

header nav{
margin-top:15px;
}

header a{
display:inline-block;
margin:8px;
}

.container{
margin:25px 15px;
padding:20px;
}


}

</style>
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header>

<h1>SmartToolsHub</h1>

<nav>

<a href="../index.html">Home</a>

</nav>

</header>

<div class="container">

<h2>Percentage Calculator</h2>

<p>Calculate your percentage easily.</p>

<label>Obtained Marks</label>

<input
type="number"
id="obtained"
placeholder="Example : 450">

<label>Total Marks</label>

<input
type="number"
id="total"
placeholder="Example : 600">

<div class="buttons">

<button onclick="calculatePercentage()">
Calculate
</button>

<button onclick="resetCalculator()">
Reset
</button>

<button onclick="copyResult()">
Copy Result
</button>

</div>

<div id="result" class="result"></div>

<div class="grade" id="grade"></div>

<div class="progress">

<div
id="progressBar"
class="progress-bar">
</div>

</div>

<div class="info">

<h3>Formula</h3>

<p>

Percentage = (Obtained Marks ÷ Total Marks) × 100

</p>

<br>

<h3>Example</h3>

<p>

If you scored 450 out of 600,

Percentage = (450 ÷ 600) × 100

= 75%

</p>

</div>

</div>



<footer>

<p>

© 2026 SmartToolsHub

</p>

</footer>

<script>

function calculatePercentage(){

    let obtained = document.getElementById("obtained").value;
    let total = document.getElementById("total").value;

    let result = document.getElementById("result");

    // Empty validation
    if(obtained=="" || total==""){

        result.style.display="block";
        result.className="result error";
        result.innerHTML="❌ Please enter both values.";

        document.getElementById("grade").innerHTML="";
document.getElementById("progressBar").style.width="0%";
        return;
    }

    obtained = Number(obtained);
    total = Number(total);

    // Invalid total marks
    if(total<=0){

        result.style.display="block";
        result.className="result error";
        result.innerHTML="❌ Total marks must be greater than 0.";
        document.getElementById("grade").innerHTML="";
document.getElementById("progressBar").style.width="0%";
        return;
    }

    // Invalid obtained marks
    if(obtained<0){

        result.style.display="block";
        result.className="result error";
        result.innerHTML="❌ Obtained marks cannot be negative.";
        document.getElementById("grade").innerHTML="";
document.getElementById("progressBar").style.width="0%";
        return;
    }

    if(obtained>total){

        result.style.display="block";
        result.className="result error";
        result.innerHTML="❌ Obtained marks cannot be greater than total marks.";
        document.getElementById("grade").innerHTML="";
document.getElementById("progressBar").style.width="0%";
        return;
    }

    // Calculate percentage
    let percentage = (obtained / total) * 100;

    percentage = percentage.toFixed(2);

    result.style.display="block";
    result.className="result";

    result.innerHTML=
"🎉 Percentage : <br><br><span style='font-size:42px;color:#2563eb;'>"
+ percentage +
"%</span>";

document.getElementById("progressBar").style.width=
percentage+"%";

let grade="";

if(percentage>=90)
grade="A+";

else if(percentage>=80)
grade="A";

else if(percentage>=70)
grade="B";

else if(percentage>=60)
grade="C";

else if(percentage>=35)
grade="Pass";

else
grade="Fail";

document.getElementById("grade").innerHTML=
"Grade : "+grade;

}
function resetCalculator(){

document.getElementById("obtained").value="";
document.getElementById("total").value="";

document.getElementById("result").style.display="none";

document.getElementById("grade").innerHTML="";

document.getElementById("progressBar").style.width="0%";

}

function copyResult(){

let text=document.getElementById("result").innerText;

navigator.clipboard.writeText(text);

alert("Result Copied!");

}

</script>

</body>

</html>
