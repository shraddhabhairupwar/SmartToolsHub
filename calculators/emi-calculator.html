<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EMI Calculator - SmartToolsHub</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f4f7fb;
}

header{
background:#2563eb;
color:white;
padding:18px 8%;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{
font-size:28px;
}

header a{
color:white;
text-decoration:none;
font-weight:bold;
margin-left:20px;
}

.container{
max-width:700px;
margin:50px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.container h2{
text-align:center;
margin-bottom:10px;
color:#2563eb;
}

.container p{
text-align:center;
color:#555;
margin-bottom:25px;
}

label{
display:block;
margin-top:18px;
margin-bottom:8px;
font-weight:bold;
}

input{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:15px;
margin-top:25px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#1d4ed8;
}

.result{
margin-top:25px;
padding:20px;
background:#e8f5e9;
border-radius:8px;
text-align:center;
font-size:22px;
font-weight:bold;
display:none;
}

.error{
background:#ffebee;
color:red;
}

.info{
margin-top:35px;
background:#f8f9fa;
padding:20px;
border-radius:10px;
line-height:1.8;
}

footer{
margin-top:50px;
background:#111827;
color:white;
text-align:center;
padding:25px;
}

.buttons{
display:flex;
gap:15px;
margin-top:25px;
}

.buttons button{
flex:1;
}


@media(max-width:768px){

header{
flex-direction:column;
}

header nav{
margin-top:15px;
}

header a{
display:inline-block;
margin:8px;
}

.container{
margin:25px 15px;
padding:20px;
}


}

</style>
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header>

<h1>SmartToolsHub</h1>

<nav>

<a href="../index.html">Home</a>

</nav>

</header>

<div class="container">

<h2>EMI Calculator</h2>

<p>Calculate your monthly loan EMI instantly.</p>

<label>Loan Amount (₹)</label>

<input
type="number"
id="loan"
min="1"
max="1000000000"
placeholder="Example : 500000"
step="0.01"
autofocus>

<label>Annual Interest Rate (%)</label>

<input
type="number"
id="interest"
placeholder="Example : 8.5"
step="0.01"
min="0.01"
max="100">

<label>Loan Tenure (Years)</label>

<input
type="number"
id="years"
placeholder="Example : 5"
step="1"
min="1"
max="50">


<div class="buttons">

<button onclick="calculateEMI()">
Calculate
</button>

<button onclick="resetCalculator()">
Reset
</button>

<button onclick="copyResult()">
Copy Result
</button>

</div>

<div id="result" class="result"></div>



<div class="info">

<h3>Formula</h3>

<p>

EMI =
P × R × (1+R)<sup>N</sup>
÷
((1+R)<sup>N</sup> − 1)

</p>

<br>

<h3>Example</h3>

<p>

Loan Amount = ₹500000

<br><br>

Interest Rate = 8.5%

<br><br>

Tenure = 5 Years

<br><br>

Monthly EMI ≈ ₹10,258

</p>

</div>

</div>



<footer>

<p>

© 2026 SmartToolsHub

</p>

</footer>

<script>

function calculateEMI(){

let loan=document.getElementById("loan").value;
let interest=document.getElementById("interest").value;
let years=document.getElementById("years").value;

let result=document.getElementById("result");

if(loan=="" || interest=="" || years==""){

result.style.display="block";
result.className="result error";
result.innerHTML="❌ Please enter all values.";

return;

}

loan=Number(loan);
interest=Number(interest);
years=Number(years);

if(loan<=0 || interest<=0 || years<=0){

result.style.display="block";
result.className="result error";
result.innerHTML="❌ Values must be greater than 0.";

return;

}

let monthlyRate=interest/12/100;

let months=years*12;

let emi=
loan*monthlyRate*Math.pow(1+monthlyRate,months)/
(Math.pow(1+monthlyRate,months)-1);

result.style.display="block";
result.className="result";

let totalPayment = emi * months;
let totalInterest = totalPayment - loan;

result.innerHTML =
"💰 Monthly EMI<br><br><span style='font-size:36px;color:#2563eb;'>₹"
+ emi.toFixed(2)
+ "</span><br><br>"
+ "💳 Total Payment : ₹" + totalPayment.toFixed(2)
+ "<br><br>"
+ "📈 Total Interest : ₹" + totalInterest.toFixed(2);

}
function resetCalculator(){

document.getElementById("loan").value="";
document.getElementById("interest").value="";
document.getElementById("years").value="";

document.getElementById("result").innerHTML="";
document.getElementById("result").style.display="none";

document.getElementById("loan").focus();
}

function copyResult(){

let text=document.getElementById("result").innerText;

if(text.trim()==""){
    alert("Please calculate first.");
    return;
}

navigator.clipboard.writeText(text);

alert("Result Copied!");

}

document.addEventListener("keydown", function(event){

    if(event.key==="Enter"){
        calculateEMI();
    }

});

</script>

</body>

</html>
