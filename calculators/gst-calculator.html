<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GST Calculator - SmartToolsHub</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f4f7fb;
}

header{
background:#2563eb;
color:white;
padding:18px 8%;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{
font-size:28px;
}

header a{
color:white;
text-decoration:none;
font-weight:bold;
margin-left:20px;
}

.container{
max-width:700px;
margin:50px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.container h2{
text-align:center;
margin-bottom:10px;
color:#2563eb;
}

.container p{
text-align:center;
color:#555;
margin-bottom:25px;
}

label{
display:block;
margin-top:18px;
margin-bottom:8px;
font-weight:bold;
}

input{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:15px;
margin-top:25px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#1d4ed8;
}

.result{
margin-top:25px;
padding:20px;
background:#e8f5e9;
border-radius:8px;
text-align:center;
font-size:22px;
font-weight:bold;
display:none;
}

.error{
background:#ffebee;
color:red;
}

.info{
margin-top:35px;
background:#f8f9fa;
padding:20px;
border-radius:10px;
line-height:1.8;
}

footer{
margin-top:50px;
background:#111827;
color:white;
text-align:center;
padding:25px;
}

.buttons{
display:flex;
gap:15px;
margin-top:25px;
}

.buttons button{
flex:1;
}


@media(max-width:768px){

header{
flex-direction:column;
}

header nav{
margin-top:15px;
}

header a{
display:inline-block;
margin:8px;
}

.container{
margin:25px 15px;
padding:20px;
}


}

</style>
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header>

<h1>SmartToolsHub</h1>

<nav>

<a href="../index.html">Home</a>

</nav>

</header>

<div class="container">

<h2>GST Calculator</h2>

<p>Calculate GST amount and final price instantly.</p>

<label>Original Price (₹)</label>

<input
type="number"
id="price"
min="0.01"
placeholder="Example : 1000"
step="0.01"
autofocus>

<label>GST Rate (%)</label>

<input
type="number"
id="gst"
placeholder="Example : 18"
step="0.01"
min="0"
max="100">


<div class="buttons">

<button onclick="calculateGST()">
Calculate
</button>

<button onclick="resetCalculator()">
Reset
</button>

<button onclick="copyResult()">
Copy Result
</button>

</div>

<div id="result" class="result"></div>



<div class="info">

<h3>Formula</h3>

<p>

GST Amount = Original Price × GST Rate ÷ 100

<br><br>

Final Price = Original Price + GST Amount

</p>

<br>

<h3>Example</h3>

<p>

Original Price = ₹1000

<br><br>

GST Rate = 18%

<br><br>

GST Amount = ₹180

<br><br>

Final Price = ₹1180

</p>

</div>

</div>



<footer>

<p>

© 2026 SmartToolsHub

</p>

</footer>

<script>

function calculateGST(){

let price=document.getElementById("price").value;
let gst=document.getElementById("gst").value;

let result=document.getElementById("result");

if(price=="" || gst==""){

result.style.display="block";
result.className="result error";
result.innerHTML="❌ Please enter both values.";

return;

}

price=Number(price);
gst=Number(gst);

if(price<=0){

result.style.display="block";
result.className="result error";
result.innerHTML="❌ Price must be greater than 0.";

return;

}

if(gst<0 || gst>100){

result.style.display="block";
result.className="result error";
result.innerHTML="❌ GST must be between 0 and 100.";

return;

}

let gstAmount=(price*gst)/100;

let finalPrice=price+gstAmount;

result.style.display="block";
result.className="result";

result.innerHTML=
"🧾 GST Amount : ₹"+gstAmount.toFixed(2)
+"<br><br>"
+"💰 Final Price : ₹"+finalPrice.toFixed(2);

}
function resetCalculator(){

document.getElementById("price").value="";
document.getElementById("gst").value="";

document.getElementById("result").innerHTML="";
document.getElementById("result").style.display="none";

document.getElementById("price").focus();
}

function copyResult(){

let text=document.getElementById("result").innerText;

if(text.trim()==""){
    alert("Please calculate first.");
    return;
}

navigator.clipboard.writeText(text);

alert("Result Copied!");

}

document.addEventListener("keydown", function(event){

    if(event.key==="Enter"){
        calculateGST();
    }

});

</script>

</body>

</html>
