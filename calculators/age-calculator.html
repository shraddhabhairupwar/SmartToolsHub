<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Age Calculator - SmartToolsHub</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f7f8f3;
}

header{
background:linear-gradient(135deg,#002c3e,#78bcc4);
color:white;
padding:18px 8%;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{
font-size:28px;
}

header a{
color:white;
text-decoration:none;
font-weight:bold;
margin-left:20px;
}

.container{
max-width:700px;
margin:50px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.container h2{
text-align:center;
margin-bottom:10px;
color:#002c3e;
}

.container p{
text-align:center;
color:#555;
margin-bottom:25px;
}

label{
display:block;
margin-top:18px;
margin-bottom:8px;
font-weight:bold;
}

input{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:15px;
margin-top:25px;
border:none;
border-radius:8px;
background:linear-gradient(135deg,#f7444e,#78bcc4);
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:linear-gradient(135deg,#d93643,#78bcc4);
}

.result{
margin-top:25px;
padding:20px;
background:linear-gradient(135deg,#78bcc4,#f7f8f3);
border-radius:8px;
text-align:center;
font-size:22px;
font-weight:bold;
display:none;
}

.error{
background:#ffebee;
color:red;
}

.info{
margin-top:35px;
background:#ffffff;
border: 1px solid rgba(120,188,196,.3);
padding:20px;
border-radius:10px;
line-height:1.8;
}

footer{
margin-top:50px;
background:linear-gradient(135deg,#002c3e,#001d2a);
color:white;
text-align:center;
padding:25px;
}

.buttons{
display:flex;
gap:15px;
margin-top:25px;
}

.buttons button{
flex:1;
}


@media(max-width:768px){

header{
flex-direction:column;
}

header nav{
margin-top:15px;
}

header a{
display:inline-block;
margin:8px;
}

.container{
margin:25px 15px;
padding:20px;
}


}

</style>
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header>

<h1>SmartToolsHub</h1>

<nav>

<a href="../index.html">Home</a>

</nav>

</header>

<div class="container">

<h2>Age Calculator</h2>

<p>Calculate your exact age in years, months, and days.</p>

<label>Date of Birth</label>

<input
type="date"
id="dob"
autofocus>


<div class="buttons">

<button onclick="calculateAge()">
Calculate
</button>

<button onclick="resetCalculator()">
Reset
</button>

<button onclick="copyResult()">
Copy Result
</button>

</div>

<div id="result" class="result"></div>



<div class="info">

<h3>Formula</h3>

<p>

Age = Current Date - Date of Birth

</p>

<br>

<h3>Example</h3>

<p>

Date of Birth = 15 August 2005
<br><br>
Today's Date = 28 July 2026
<br><br>
Age = 20 Years, 11 Months, 13 Days
</p>

</div>

</div>



<footer>

<p>

© 2026 SmartToolsHub

</p>

</footer>

<script>

function calculateAge(){

let dob=document.getElementById("dob").value;

let result=document.getElementById("result");

if(dob==""){

result.style.display="block";
result.className="result error";
result.innerHTML="❌ Please select your Date of Birth.";

return;

}

let birthDate=new Date(dob);

let today=new Date();

if(birthDate > today){

result.style.display="block";
result.className="result error";
result.innerHTML="❌ Date of Birth cannot be in the future.";

return;

}

let years=today.getFullYear()-birthDate.getFullYear();
let months=today.getMonth()-birthDate.getMonth();
let days=today.getDate()-birthDate.getDate();

if(days<0){

months--;

let lastMonth=new Date(today.getFullYear(),today.getMonth(),0);

days+=lastMonth.getDate();

}

if(months<0){

years--;

months+=12;

}

result.style.display="block";

result.className="result";

result.innerHTML=

"🎂 Age : <b>"
+years+
" Years "
+months+
" Months "
+days+
" Days</b>";

}
function resetCalculator(){

document.getElementById("dob").value="";

document.getElementById("result").innerHTML="";
document.getElementById("result").style.display="none";
}

function copyResult(){

let text=document.getElementById("result").innerText;

if(text.trim()==""){
    alert("Please calculate first.");
    return;
}

navigator.clipboard.writeText(text);

alert("Result Copied!");

}

document.addEventListener("keydown", function(event){

    if(event.key==="Enter"){
        calculateAge();
    }

});

</script>

</body>

</html>
